<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Projects — TaskFlow</title>
  <link rel="stylesheet" href="assets/css/design-system.css">
  <style>
    .projects-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; margin-top:24px; }
    .project-card { background:var(--bg-surface); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:24px; transition:var(--transition); cursor:pointer; box-shadow:var(--shadow-card); }
    .project-card:hover { transform:translateY(-4px); border-color:rgba(34,211,238,0.42); box-shadow:var(--shadow-glow); }
    .project-card-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
    .project-name { font-family:'Outfit',sans-serif; font-size:1.1rem; font-weight:700; margin-bottom:6px; }
    .project-desc { font-size:0.82rem; color:var(--text-muted); margin-bottom:16px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .project-meta { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; }
    .meta-chip { display:flex; align-items:center; gap:5px; font-size:0.78rem; color:var(--text-secondary); }
    .member-stack { display:flex; margin-top:12px; }
    .member-stack .avatar { margin-right:-8px; border:2px solid var(--bg-surface); }
    .card-actions { display:flex; gap:6px; }
  </style>
</head>
<body>
<div class="app-layout">
  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Projects</span>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm admin-only" id="new-project-btn" onclick="openModal('project-modal')">+ New Project</button>
      </div>
    </header>
    <main class="page-content">
      <div class="mb-6">
        <h2>Your Projects</h2>
        <p>Manage and track all your team projects.</p>
      </div>
      <div id="projects-container">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </main>
  </div>
</div>

<!-- Project Modal -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="project-modal-title">New Project</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="input-group"><label class="input-label">Project Name *</label><input id="proj-name" class="input" placeholder="e.g. Website Redesign"></div>
      <div class="input-group"><label class="input-label">Description</label><textarea id="proj-desc" class="input" placeholder="What is this project about?"></textarea></div>
      <div class="input-group"><label class="input-label">Status</label>
        <select id="proj-status" class="input">
          <option value="active">Active</option><option value="completed">Completed</option><option value="archived">Archived</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('project-modal')">Cancel</button>
      <button class="btn btn-primary" id="save-project-btn" onclick="saveProject()">Create Project</button>
    </div>
  </div>
</div>

<!-- Members Modal -->
<div class="modal-overlay" id="members-modal">
  <div class="modal" style="max-width:580px">
    <div class="modal-header">
      <span class="modal-title">Manage Members</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="input-group admin-only">
        <label class="input-label">Add Member</label>
        <div class="flex gap-2">
          <select id="add-member-select" class="input">
            <option value="">Select user…</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="addMember()">Add</button>
        </div>
      </div>
      <div id="members-list"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('members-modal')">Close</button></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script>
  initNav('projects');
  let projects=[], editingId=null, currentProjectId=null;

  async function load() {
    try {
      const d = await API.projects.list();
      projects = d.projects || [];
      renderProjects();
    } catch(e) { showToast(e.message,'error'); }
  }

  function renderProjects() {
    const el = document.getElementById('projects-container');
    if (!projects.length) {
      el.innerHTML='<div class="empty-state"><div class="empty-title">No projects yet</div><div class="empty-sub">Create your first project to get started.</div></div>'; return;
    }
    el.innerHTML = `<div class="projects-grid">${projects.map(renderCard).join('')}</div>`;
  }

  function renderCard(p) {
    const pct = p.task_count ? Math.round((p.done_count/p.task_count)*100) : 0;
    return `<div class="project-card">
      <div class="project-card-header">
        <div>
          <div class="project-name">${p.name}</div>
          ${badge(p.status,p.status)}
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" title="Members" onclick="event.stopPropagation();openMembers(${p.id})">Members</button>
          <button class="btn btn-ghost btn-sm admin-only" title="Edit" onclick="event.stopPropagation();editProject(${p.id})">Edit</button>
          <button class="btn btn-ghost btn-sm admin-only" title="Delete" onclick="event.stopPropagation();deleteProject(${p.id})">Delete</button>
        </div>
      </div>
      <div class="project-desc">${p.description||'No description'}</div>
      <div class="progress-bar mb-2"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="project-meta">
        <span class="meta-chip">${p.done_count||0}/${p.task_count||0} tasks done</span>
        <span class="meta-chip">${p.member_count||0} members</span>
        <span class="meta-chip text-muted">${new Date(p.created_at).toLocaleDateString()}</span>
      </div>
    </div>`;
  }

  function editProject(id) {
    const p = projects.find(x=>x.id===id);
    if(!p) return;
    editingId = id;
    document.getElementById('project-modal-title').textContent = 'Edit Project';
    document.getElementById('proj-name').value = p.name;
    document.getElementById('proj-desc').value = p.description||'';
    document.getElementById('proj-status').value = p.status;
    document.getElementById('save-project-btn').textContent = 'Save Changes';
    openModal('project-modal');
  }

  async function saveProject() {
    const name = document.getElementById('proj-name').value.trim();
    if(!name) { showToast('Name is required','error'); return; }
    const body = { name, description: document.getElementById('proj-desc').value, status: document.getElementById('proj-status').value };
    try {
      if(editingId) await API.projects.update(editingId, body);
      else await API.projects.create(body);
      closeModal('project-modal'); showToast(editingId?'Project updated':'Project created','success');
      editingId=null; document.getElementById('save-project-btn').textContent='Create Project';
      document.getElementById('project-modal-title').textContent='New Project';
      document.getElementById('proj-name').value=''; document.getElementById('proj-desc').value='';
      load();
    } catch(e) { showToast(e.message,'error'); }
  }

  async function deleteProject(id) {
    if(!confirm('Delete this project? This will also delete all tasks.')) return;
    try { await API.projects.delete(id); showToast('Project deleted','success'); load(); }
    catch(e) { showToast(e.message,'error'); }
  }

  let allUsers=[];
  async function openMembers(id) {
    currentProjectId=id;
    try {
      const [pd, ud] = await Promise.all([API.projects.get(id), getUser().role==='admin'?API.users.list():Promise.resolve({users:[]})]);
      allUsers = ud.users||[];
      renderMembers(pd.members||[], allUsers);
      openModal('members-modal');
    } catch(e) { showToast(e.message,'error'); }
  }

  function renderMembers(members, allUsers) {
    const memberIds = members.map(m=>m.id);
    const sel = document.getElementById('add-member-select');
    sel.innerHTML='<option value="">Select user…</option>' + allUsers.filter(u=>!memberIds.includes(u.id)).map(u=>`<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
    document.getElementById('members-list').innerHTML = members.map(m=>`
      <div class="flex items-center gap-3" style="padding:10px 0;border-bottom:1px solid rgba(103,232,249,0.10)">
        ${avatar(m.name,m.avatar_color)}
        <div style="flex:1"><div class="text-sm font-bold">${m.name}</div><div class="text-xs text-muted">${m.email}</div></div>
        ${badge(m.role,m.role)}
        <button class="btn btn-ghost btn-sm admin-only" onclick="removeMember(${m.id})">Remove</button>
      </div>`).join('');
  }

  async function addMember() {
    const userId = document.getElementById('add-member-select').value;
    if(!userId) return;
    try {
      await API.projects.addMember(currentProjectId, userId);
      showToast('Member added','success'); openMembers(currentProjectId);
    } catch(e) { showToast(e.message,'error'); }
  }

  async function removeMember(userId) {
    try {
      await API.projects.removeMember(currentProjectId, userId);
      showToast('Member removed','success'); openMembers(currentProjectId);
    } catch(e) { showToast(e.message,'error'); }
  }

  initModals(); load();
</script>
</body>
</html>
